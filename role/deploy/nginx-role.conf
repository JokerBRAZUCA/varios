# /etc/nginx/sites-available/role
# Bloco HTTP inicial. O Certbot (--nginx) acrescenta o bloco HTTPS e o redirecionamento.
server {
    listen 80;
    listen [::]:80;
    server_name role.close4us.com;

    root /var/www/role;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Módulos do jogo; versões novas precisam chegar logo.
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Multiplayer: repassa a conexão WebSocket ao servidor Node local.
    location = /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html text/javascript image/svg+xml;
}
