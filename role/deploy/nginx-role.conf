# /etc/nginx/sites-available/role
# Bloco HTTP inicial. O Certbot (--nginx) acrescenta o bloco HTTPS e o redirecionamento.
server {
    listen 80;
    listen [::]:80;
    server_name role.close4us.com;

    root /var/www/role;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # A página muda a cada versão; a imagem e o ícone podem ficar em cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(png|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html image/svg+xml;
}
